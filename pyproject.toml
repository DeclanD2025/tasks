[project]
name = "orion"
version = "0.1.0"
description = "ORION — a local-first personal observability platform (native desktop app)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Declan Dundas" }]

dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "APScheduler>=3.10",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyqtgraph>=0.13",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pdfplumber>=0.11",
    "pypdf>=6.0",
    # Two-way task sync with the companion tasks app (Supabase REST).
    "httpx>=0.27",
    # Web access layer (app.web): the same local data served as a mobile-first
    # webapp on the LAN. No hosted backend — uvicorn runs on this machine.
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# iOS/iCloud calendar via the macOS EventKit framework. Optional so the app
# still installs on non-macOS platforms (the calendar connector degrades to a
# mock when EventKit is unavailable).
macos = ["pyobjc-framework-EventKit>=10.0"]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
packaging = [
    "pyinstaller>=6.8",
]

[project.scripts]
orion = "app.main:main"
orion-web = "app.web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
