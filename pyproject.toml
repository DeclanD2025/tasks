[project]
name = "orion"
version = "0.1.0"
description = "ORION — a local-first personal observability platform (native desktop app)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Declan Dundas" }]

dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "APScheduler>=3.10",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyqtgraph>=0.13",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
packaging = [
    "pyinstaller>=6.8",
]

[project.scripts]
orion = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
